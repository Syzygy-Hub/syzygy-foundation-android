name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build
        run: ./gradlew build

      - name: Test
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: warn

      - name: Coverage summary
        run: |
          {
            echo "## Test Results"
            echo "Test report available in build artifacts."
            echo "Run \`./gradlew test\` locally and open \`build/reports/tests/test/index.html\` to view."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ktlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/Syzygy-Hub/.github/becfecefa5a3dbe0f4ca1d860a2b9483d3c236f7/engineering/tooling/android/.editorconfig \
            -o .editorconfig
          ./gradlew ktlintCheck

  release:
    name: Release
    needs: [build]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Read version from syzygy.yml
        id: version
        run: |
          VERSION=$(grep '^version:' syzygy.yml | sed 's/version: //' | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract CHANGELOG entry
        run: |
          awk '/^## \[/{if(found) exit; found=1; next} found' CHANGELOG.md > release_notes.txt

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.VERSION }}" \
            --title "${{ steps.version.outputs.VERSION }}" \
            --notes-file release_notes.txt

      - name: Publish to JitPack
        run: ./gradlew publish
