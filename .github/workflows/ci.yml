name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: ./gradlew build

      - name: Test
        run: ./gradlew test

      - name: Coverage summary
        run: |
          REPORT=$(find build/reports/tests -name "index.html" 2>/dev/null | head -1)
          {
            echo "## Test Results"
            echo "Test report available in build artifacts."
            echo "Run \`./gradlew test\` locally and open \`build/reports/tests/test/index.html\` to view."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ktlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/Syzygy-Hub/.github/main/engineering/tooling/android/.editorconfig \
            -o .editorconfig
          ./gradlew ktlintCheck

  release:
    name: Release
    needs: [build]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Read version from syzygy.yml
        id: version
        run: |
          VERSION=$(grep '^version:' syzygy.yml | sed 's/version: //' | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract CHANGELOG entry
        run: |
          awk '/^## \[/{if(found) exit; found=1; next} found' CHANGELOG.md > release_notes.txt

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.VERSION }}" \
            --title "${{ steps.version.outputs.VERSION }}" \
            --notes-file release_notes.txt

      - name: Publish to JitPack
        run: ./gradlew publish
